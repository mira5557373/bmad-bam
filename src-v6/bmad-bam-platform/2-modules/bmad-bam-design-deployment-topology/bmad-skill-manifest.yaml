name: bmad-bam-design-deployment-topology
description: "Design rollout strategy + tenant cohorts for multi-tenant SaaS deployments."
module: bmad-bam-platform
persona: atlas
version: 0.1.0
execution_mode:
  default: assisted
  alternatives: [manual]
