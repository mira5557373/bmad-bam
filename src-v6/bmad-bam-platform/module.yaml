code: bbp
name: "BAM v6 — Platform Module"
version: "0.4.0"   # Documented for tooling that reads module.yaml directly. NOTE: BMAD's installer (official-modules.js:155, v6.6.0) defaults to '1.0.0' downstream of plugin-resolver, so `bmad status` will show `bbp 1.0.0` regardless. Field is preserved as the canonical source of truth.
description: "Multi-tenant SaaS platform foundation. Wave 0: smoke-test skeleton only. Wave P2 builds the full module."
default_selected: false

# Variables from Core Config inserted:
## user_name
## project_name
## communication_language
## document_output_language
## output_folder

# Activation guidance shown to the user by BMAD's installer immediately after
# this module's configuration is collected. BMAD's installer reads this key and
# pipes each line to the user via prompts.log.message (see
# external/bmad-method/tools/installer/modules/official-modules.js
# `displayModulePostConfigNotes`, ~lines 2103-2143). It is NOT executed code.
#
# We use Path B activation (manual finalize) per the v0.5 patch outcome (Task 0
# of P2.1, 2026-05-12) — npm postinstall is not viable as a target-project
# activation mechanism. See tests/p2/INVESTIGATION-NOTES.md for full rationale.
post-install-notes: |
  BAM v6 platform module installed. To finalize activation, invoke the
  `bmad-bam-finalize` skill in your AI agent:

      Claude Code: type `/bmad-bam-finalize` or ask "run bmad-bam-finalize"
      Cursor:      type `/bmad-bam-finalize`
      Direct:      bash {project-root}/.claude/skills/bmad-bam-finalize/scripts/post-install.sh {project-root}

  (Replace `.claude/skills/` with your tool's skill dir as appropriate.)

  This step generates the universal-glob auto-load sentinel at
    {project-root}/{output_folder}/bbp/project-context.md
  (default {output_folder} is _bmad-output/, per BMM convention — see
  v0.7 spec §7.6) and appends an audit entry to
    {project-root}/_bmad/bam/install-logs/platform-install.log
  Re-running is safe (the sentinel is replaced atomically; the log is append-only).

  Once finalize completes, Atlas's design workflows are usable, e.g.:
      `/bmad-bam-design-tenancy-model` in Claude Code/Cursor

# Directories to create during installation (declarative, no code execution).
# BMAD's installer reads this list. All other declarations below are loaded by
# BMAD-side tooling that scans the module's filesystem layout — there is no
# `install:` or `verify:` key recognised by the BMAD installer in v6.6.0.
# BAM-family cross-module dirs (_bmad/bam/, _bmad/bam/install-logs/) are
# created at runtime by 9-infrastructure/bmad-bam-finalize/scripts/post-install.sh's
# defensive `mkdir -p` (post-install.sh:156). They are NOT declared in this
# `directories:` block because:
#
# 1. BMAD's createModuleDirectories (official-modules.js:587+) only honors
#    entries matching ^\{name\}$ (variable-reference form like
#    {planning_artifacts}). Literal paths like {project-root}/_bmad/bam are
#    silently SKIPPED. Empirically verified Concern 7 / 2026-05-16.
#
# 2. BAM-family cross-module dirs (_bmad/bam/) are FIXED conventions, not
#    user-configurable. BMM uses `directories:` for user-config-driven paths
#    (e.g., {planning_artifacts}, {implementation_artifacts}); BAM's case
#    doesn't fit that pattern.
#
# 3. post-install.sh's defensive mkdir is the canonical creation site;
#    making BMAD's installer also try (and fail to) create them would be
#    redundant misdirection.
#
# The sentinel file `{output_folder}/<code>/project-context.md` (per Concern 5
# / v0.9 §7.6) lives outside `_bmad/`; BMAD's installer creates
# `_bmad-output/` via the core config flow (installer.js:1038), so the
# subdir's parent is reliably present at finalize time.
#
# See: ADR 009 (Concern 7 — directories: cleanup).
directories: []

# Agent roster — essence only. Full persona behavior lives in the persona-skill
# `1-foundation/bmad-bam-agent-atlas/customize.toml` (BMM-canonical phase-grouped
# layout per Concern 5 / v0.9 spec §6.1 — agents are real, invocable skills, not
# module-root content). `team` defaults to the module code when omitted.
agents:
  - code: bmad-bam-agent-atlas
    name: Atlas
    title: Platform Architect
    icon: "🏛️"
    team: bam
    description: "Multi-tenant SaaS platform architect. Holds up the platform sky — RLS strategy, modular monolith decomposition, tenant tier modeling, FinOps. Speaks like a structural engineer at a whiteboard: load-bearing decisions first, every gate explicit. Owns QG-F1 (Foundation), QG-M1 (Module Architecture), QG-M2 (Tenant Isolation), QG-DA1 (Data Architecture). Invocable via `/bmad-bam-agent-atlas` (Claude Code/Cursor) or natural-language activation; also the canonical home for shared platform-module resources (resources/fragments/, resources/patterns/, resources/checklists/, resources/standards/)."

# --- BAM-specific extensions (not consumed by BMAD's installer) -------------
# The keys below are documentation for BAM's own tooling and human readers.
# They have no effect on BMAD's install/uninstall flow. P2 may move them to a
# separate BAM-side manifest file once that tooling exists.

# Minimum BMAD method version this module supports. Enforced by the
# bmad-bam-smoke-test skill (step-01), not by BMAD's installer.
x-bam-requires:
  bmad: ">=6.4.0,<7.0.0"
  python: ">=3.11"        # resolve_customization.py uses stdlib tomllib

# Wave 0 verification artefacts. The runner (tests/wave-0/run-smoke-test.sh)
# and step-08 each write a family.json that should contain these paths.
#
# Activation script (`scripts/post-install.sh`) is now invoked by the
# bmad-bam-finalize skill, surfaced to the user via `post-install-notes` above.
# The former `x-bam-post-install:` key was removed in P2.1 Task 1 (Path B) —
# it was a dead key (BMAD's installer ignores `x-*` extensions; see
# tests/p2/INVESTIGATION-NOTES.md "Surprising / worth flagging" #3).
x-bam-wave-0-artifacts:
  generated:
    - "{project-root}/{output_folder}/bbp/project-context.md"   # by bmad-bam-finalize
    - "{project-root}/_bmad/bam/family.json"               # by smoke-test step-08
  skills-registered:
    - bmad-bam-agent-atlas
    - bmad-bam-smoke-test
    - bmad-bam-finalize
    - bmad-bam-design-tenancy-model
